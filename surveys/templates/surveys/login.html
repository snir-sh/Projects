<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>Survey System — Login</title>
    <style>
      body{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding:40px; direction:rtl; text-align:right}
      .box{max-width:420px;margin:40px auto;padding:20px;border:1px solid #ddd;border-radius:8px}
      label{display:block;margin:8px 0}
      input[type=text], input[type=password]{width:100%;padding:8px;border:1px solid #ccc;border-radius:4px;direction:rtl;text-align:right}
      button{padding:8px 12px;margin-top:12px}
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Sign in</h1>
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <label>Username
          {{ form.username }}
        </label>
        <label>Password
          {{ form.password }}
        </label>
        <input type="hidden" name="next" value="{{ next }}" />
        <button type="submit">Sign in</button>
      </form>
      <p style="margin-top:12px; font-size:.9em">Default password for new users is <strong>password</strong>.</p>
    </div>
  </body>
</html>
