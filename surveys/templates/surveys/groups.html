<!doctype html>
<html lang="he" dir="rtl">
  <head><meta charset="utf-8"><title>Manage Groups</title></head>
  <body style="direction: rtl; text-align: right;">
    <h1>Groups</h1>
    <form method="post">
      {% csrf_token %}
      <label>Name: <input type="text" name="name" required></label>
      <div style="margin-top:8px">
        <button type="submit" name="_save">Save and exit</button>
        <button type="submit" name="_addanother">Save and add another</button>
      </div>
    </form>

    <h2>Existing</h2>
    <ul>
      {% for g in groups %}
        <li>{{ g.name }}</li>
      {% empty %}
        <li>No groups yet</li>
      {% endfor %}
    </ul>

    <p><a href="/">Back</a></p>
  </body>
</html>
